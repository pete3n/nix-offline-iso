# Offline-installer welcome.conf.
#
# Shipped wholesale by the nix-offline-iso overlay to REPLACE upstream's file.
# The only functional change vs. upstream is that the `internet` requirement is
# removed from both `check` and `required`, so the installer runs with no
# network connection. `internetCheckUrl` is intentionally omitted (nothing
# checks it once `internet` is dropped).
#
# This is a controlled copy rather than a context diff on purpose: a whole-file
# replacement only breaks if the welcome.conf *schema* changes, not merely its
# formatting. Reconcile with upstream when bumping nixpkgs.
showReleaseNotesUrl: true

requirements:
    requiredStorage: 10
    requiredRam: 3.0

    check:
        - storage
        - ram
        - power
        - screen

    required:
        - storage
        - ram
