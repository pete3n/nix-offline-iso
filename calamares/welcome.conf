# Proxied-installer welcome.conf.
#
# Replaces the Calamares installer's welcome.conf file.
# The only functional change vs. upstream is that the `internet` requirement is
# removed from both `check` and `required`. The stock check probes
# geoip.kde.org and cache.nixos.org directly — both unreachable behind the
# Cache proxy — and it runs at startup, before any screen could collect the
# Cache URL. The Proxy screen's Reachability probe replaces it (see
# docs/adr/0002). `internetCheckUrl` is intentionally omitted (nothing checks
# it once `internet` is dropped).
showReleaseNotesUrl: true

requirements:
    requiredStorage: 10
    requiredRam: 3.0

    check:
        - storage
        - ram
        - power
        - screen

    required:
        - storage
        - ram
