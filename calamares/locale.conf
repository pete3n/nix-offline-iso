# Proxied-installer locale.conf.
#
# Replaces the Calamares installer's locale.conf file.
# The only functional change vs. upstream is that the `geoip:` block is
# removed: geoip.kde.org is unreachable behind the Cache proxy, so the
# lookup could only fail (or stall on a timeout) before falling back to
# manual timezone selection. Without it, manual selection is the
# deterministic behavior.
#
# @glibcLocales@ is substituted by the overlay's postInstall — the stock
# installPhase substitution has already run by the time this replacement
# is copied in.
useSystemTimezone: true

# Isn't supported on NixOS
adjustLiveTimezone: false

localeGenPath: @glibcLocales@/share/i18n/SUPPORTED
