# Offline-installer welcome.conf.
#
# Replaces the Calamares installer's welcome.conf file.
# The only functional change vs. upstream is that the `internet` requirement is
# removed from both `check` and `required`, so the installer runs with no
# network connection. `internetCheckUrl` is intentionally omitted (nothing
# checks it once `internet` is dropped).
showReleaseNotesUrl: true

requirements:
    requiredStorage: 10
    requiredRam: 3.0

    check:
        - storage
        - ram
        - power
        - screen

    required:
        - storage
        - ram
